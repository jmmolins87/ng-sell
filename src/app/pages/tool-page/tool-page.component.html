


<div 
    [ngClass]="isDarkMode ? 'dark-theme' : 'light-theme'" 
    class="wrap-tool animate__animated animate__fadeIn">
    <div class="wrap-header">
        <div class="wrapper-title">
            <div class="wrap-title">
                <app-title-pages 
                    [text]="tool.title" 
                    [titleType]="titleType" 
                    [withUnderline]="false"
                    [withoutMarginBottom]="true" />
                <div *ngIf="tool.favorite" class="wrap-icon-favorite animate__animated animate__fadeIn animate__slideInDown">
                    <i [ngStyle]="{'color': tool.favorite === true ? '#e90502' : ''}"
                        style="font-size: 1.6rem;" class="pi pi-heart-fill"></i>
                </div>
            </div>
            <p class="subtitle">{{ tool.subtitle | translate }}</p>
        </div>
        <div class="wrap-logo">
            <app-wrap-imgs 
                [imageSrc]="tool.image"
                [altImg]="tool.title | translate"
                [title]="tool.title | translate"
                [shapeSkeleton]="shapeSkeleton"
                [showSkeleton]="showSkeleton" />
        </div>
    </div>
    <div class="wrap-content">
        <div class="wrap-chart-description">
            <div class="char">
                <app-wrap-chart *ngIf="!showSkeleton" [dataChart]="tool" [skill]="'TOOL_PAGE.SKILL' | translate" />
                <p-skeleton *ngIf="showSkeleton" shape="circle" size="30rem" />
            </div>
            <div class="wrap-description">
                <p *ngIf="!showSkeleton" class="description">{{ tool.description | translate }}</p>
                <div class="wrap-button-site">
                    <a 
                        [href]="tool.link" 
                        target="_blank" 
                        rel="noopener noreferrer" 
                        class="button-site">
                        <p-button 
                            *ngIf="!showSkeleton"
                            icon="pi pi-link"
                            iconPos="right"
                            [label]="'TOOL_PAGE.GO_WEB_TOOL' | translate" 
                            [outlined]="true" 
                            severity="info" />
                    </a>
                </div>
                <div *ngIf="showSkeleton" class="skeleton-description" style="display: flex; flex-direction: column; justify-content: flex-start; gap: 2rem;">
                    <p-skeleton height="2rem" />
                    <p-skeleton height="2rem" />
                    <p-skeleton height="2rem" />
                    <p-skeleton height="2rem" />
                    <p-skeleton height="2rem" />
                </div>
            </div>
        </div>
        <ul class="wrap-skills">
            <li *ngFor="let tag of tool.tags; let i = index" class="skill">
                <app-skill-tool *ngIf="!showSkeleton" [nameTag]="tag"></app-skill-tool>
                <p-skeleton *ngIf="showSkeleton" height="20rem" width="100%" />
            </li>
        </ul>
    </div>
    <div class="wrap-button-back">
        <p-button 
            (click)="goBack()" 
            icon="pi pi-arrow-left"
            [label]="'TOOL_PAGE.TOOL_BUTTON_BACK' | translate" 
            [outlined]="true" 
            severity="info" />
    </div>
</div>


<p-scrollTop [icon]="'pi pi-arrow-up'" />
