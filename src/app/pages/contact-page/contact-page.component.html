<div class="wrap-contact animate__animated animate__fadeIn">
    <app-title-pages [titleType]="titleType" [title]="'CONTACT_PAGE.TITLE' | translate"></app-title-pages>
    <form [formGroup]="formContact" autocomplete="off" class="wrap-form">
        <div class="wrapper-form">
            <!-- Name camp -->
            <div class="form-group">
                <span class="p-float-label">
                    <input formControlName="name" pInputText id="username" [ngClass]="{ success: name?.valid }" />
                    <label htmlFor="username">
                        {{ "CONTACT_PAGE.LABEL_NAME" | translate }} <span class="required">*</span>
                    </label>
                </span>
            </div>
            <!-- Surname camp -->
            <div class="form-group">
                <span class="p-float-label">
                    <input formControlName="surname" pInputText id="surname" />
                    <label htmlFor="surname">
                        {{ "CONTACT_PAGE.LABEL_SURNAME" | translate}}
                    </label>
                </span>
            </div>
            <!-- Company camp -->
            <div class="form-group">
                <span class="p-float-label">
                    <input formControlName="company" pInputText id="company" [ngClass]="{ success: company?.valid }" />
                    <label htmlFor="company">
                        {{ "CONTACT_PAGE.LABEL_COMPANY" | translate }} <span class="required">*</span>
                    </label>
                </span>
            </div>
            <!-- E-mail camp -->
            <div class="form-group">
                <span class="p-float-label">
                    <input formControlName="email" pInputText id="e-mail" [ngClass]="{ success: email?.valid }" />
                    <label htmlFor="e-mail">
                        {{ "CONTACT_PAGE.LABEL_EMAIL" | translate }} <span class="required">*</span>
                    </label>
                </span>
            </div>
            <!-- Phone camp -->
            <div class="form-group">
                <span class="p-float-label">
                    <input formControlName="phone" pInputText id="phone" />
                    <label htmlFor="phone">
                        {{ "CONTACT_PAGE.LABEL_PHONE" | translate }}
                    </label>
                </span>
            </div>
            <!-- Subject camp -->
            <div class="form-group">
                <span class="p-float-label">
                    <input formControlName="subject" pInputText id="subject" [ngClass]="{ success: subject?.valid }" />
                    <label htmlFor="subject">
                        {{ "CONTACT_PAGE.LABEL_SUBJECT" | translate }} <span class="required">*</span>
                    </label>
                </span>
            </div>
            <!-- Message camp -->
            <div class="form-group textarea">
                <span class="p-float-label">
                    <textarea formControlName="message" id="textarea" rows="5" cols="30" pInputTextarea
                        [(ngModel)]="messageCharactres" (input)="updateCounter()"
                        [ngClass]="{ success: message?.valid }">
                    </textarea>
                    <label for="textarea">
                        {{ "CONTACT_PAGE.LABEL_MESSAGE" | translate }} <span class="required">*</span>
                    </label>
                    <p class="counter-characters">
                        {{ "CONTACT_PAGE.NUMBER_CHARACTERS" | translate }}: {{ characterCount }} {{ "CONTACT_PAGE.OF" | translate }} {{ maxCharacters }}
                    </p>
                </span>
            </div>
        </div>
        <div class="wrap-buttons">
            <div class="wrap-button-reset">
                <p-button 
                    [label]="'CONTACT_PAGE.RESET_BUTTON' | translate"
                    [outlined]="true" 
                    severity="danger" />
            </div>
            <div class="wrap-button-send">
                <p-button 
                    type="submit" 
                    [disabled]="formContact.invalid" 
                    [label]="'CONTACT_PAGE.SEND_BUTTON' | translate" 
                    [outlined]="true"
                    severity="info" />
            </div>
        </div>
    </form>
</div>
