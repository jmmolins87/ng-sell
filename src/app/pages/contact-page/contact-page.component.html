<div [ngClass]="isDarkMode ? 'dark-theme' : 'light-theme'" class="wrap-contact">
    <app-title-pages [titleType]="titleType" [title]="'CONTACT_PAGE.TITLE' | translate"></app-title-pages>
    <form [formGroup]="formContact" autocomplete="off" class="wrap-form animate__animated animate__fadeIn">
        <div class="wrapper-form">
            <!-- Name camp -->
            <div class="form-group">
                <span class="p-float-label">
                    <input 
                        pInputText 
                        formControlName="name" 
                        id="username" >
                    <label htmlFor="username">
                        {{ "CONTACT_PAGE.LABEL_NAME" | translate }} <span class="required">*</span>
                    </label>
                </span>
                <span 
                    *ngIf="isValidField('name')" 
                    class="label-error">
                    {{ getFieldError('name') }}
                </span>
            </div>
            <!-- Surname camp -->
            <div class="form-group">
                <span class="p-float-label">
                    <input 
                        pInputText 
                        formControlName="surname" 
                        id="surname" />
                    <label htmlFor="surname">{{ "CONTACT_PAGE.LABEL_SURNAME" | translate }}</label>
                </span>
            </div>
            <!-- Company camp -->
            <div class="form-group">
                <span class="p-float-label">
                    <input 
                        pInputText 
                        formControlName="company" 
                        id="company" >
                    <label htmlFor="company">
                        {{ "CONTACT_PAGE.LABEL_COMPANY" | translate }} <span class="required">*</span>
                    </label>
                </span>
                <span 
                    *ngIf="isValidField('company')" 
                    class="label-error">
                    {{ getFieldError('company') }}
                </span>
            </div>
            <!-- E-mail camp -->
            <div class="form-group">
                <span class="p-float-label">
                    <input 
                        pInputText 
                        formControlName="email" 
                        id="e-mail" >
                    <label htmlFor="e-mail">
                        {{ "CONTACT_PAGE.LABEL_EMAIL" | translate }} <span class="required">*</span>
                    </label>
                </span>
                <span 
                    *ngIf="isValidField('email')" 
                    class="label-error">
                    {{ getFieldError('email') }}
                </span>
            </div>
            <!-- Phone camp -->
            <div class="form-group">
                <span class="p-float-label">
                    <input 
                        pInputText 
                        formControlName="phone" 
                        id="phone" />
                    <label htmlFor="phone">{{ "CONTACT_PAGE.LABEL_PHONE" | translate }}</label>
                </span>
            </div>
            <!-- Subject camp -->
            <div class="form-group">
                <span class="p-float-label">
                    <input 
                        pInputText 
                        formControlName="subject" 
                        id="subject" >
                    <label htmlFor="subject">
                        {{ "CONTACT_PAGE.LABEL_SUBJECT" | translate }} <span class="required">*</span>
                    </label>
                </span>
                <span 
                    *ngIf="isValidField('subject')" 
                    class="label-error">
                    {{ getFieldError('subject') }}
                </span>
            </div>
            <!-- Message camp -->
            <div class="form-group textarea">
                <span class="p-float-label">
                    <textarea 
                        pInputText 
                        formControlName="message" 
                        id="textarea" 
                        rows="10" 
                        cols="30" 
                        [(ngModel)]="messageCharactres" 
                        (input)="updateCounter()">
                    </textarea>
                    <label for="textarea">
                        {{ "CONTACT_PAGE.LABEL_MESSAGE" | translate }} <span class="required">*</span>
                    </label>
                    <div class="wrap-info-textarea">
                        <p class="counter-characters">
                            {{ "CONTACT_PAGE.NUMBER_CHARACTERS" | translate }}: {{ characterCount }} {{ "CONTACT_PAGE.OF" | translate }} {{ maxCharacters }}
                        </p>
                        <span 
                            *ngIf="isValidField('message')" 
                            class="label-error textarea">
                            {{ getFieldError('message') }}
                        </span>
                    </div>
                </span>
            </div>
        </div>
        <div class="wrapper-buttons">
            <div class="wrap-button-reset">
                <p-button 
                    [label]="'CONTACT_PAGE.RESET_BUTTON' | translate"
                    [outlined]="true" 
                    severity="danger" />
            </div>
            <div class="wrap-button-send">
                <p-button 
                    type="submit" 
                    [disabled]="formContact.invalid" 
                    [label]="'CONTACT_PAGE.SEND_BUTTON' | translate" 
                    [outlined]="true"
                    severity="info" />
            </div>
        </div>
    </form>
</div>
