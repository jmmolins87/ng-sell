
<div *ngIf="showSkeleton; else loadedContent" class="wrap-skeleton">
    <p-skeleton width="50rem" height="5rem" />
</div>

<ng-template #loadedContent>
    <div [ngClass]="isDarkMode ? 'dark-theme' : 'light-theme'" class="wrap-title animate__animated animate__fadeIn">
        <h1 
            *ngIf="titleType === 'home'" 
            #typewriterText 
            [ngClass]="
                [withUnderline ? 'with-underline' : '', 
                titleHome ? 'sizes-home' : '', 
                centerText ? 'center-text' : '',
                withoutMarginBottom ? 'without-margin-bottom' : '']" 
            class="title">{{ translatedTitle$ | async }}
        </h1>
        <h1 
            *ngIf="titleType === 'h1'" 
            #typewriterText 
            [ngClass]="
                [withUnderline ? 'with-underline' : '', 
                centerText ? 'center-text' : '',
                withoutMarginBottom ? 'without-margin-bottom' : '']" 
            class="title">{{ translatedTitle$ | async }}
        </h1>
        <h2 
            *ngIf="titleType === 'h2'" 
            #typewriterText 
            [ngClass]="
                [withUnderline ? 'with-underline' : '', 
                centerText ? 'center-text' : '',
                withoutMarginBottom ? 'without-margin-bottom' : '']" 
            class="title">{{ translatedTitle$ | async }}
        </h2>
        <h3 
            *ngIf="titleType === 'h3'" 
            #typewriterText 
            [ngClass]="
                [withUnderline ? 'with-underline' : '', 
                centerText ? 'center-text' : '',
                withoutMarginBottom ? 'without-margin-bottom' : '']" 
            class="title">{{ translatedTitle$ | async }}
        </h3>
    </div>
</ng-template>
